name: release

# Push a tag like v0.2.0 to build dakken and publish a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: create
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: dakken.exe
          # Windows on ARM: cross-built with the MSVC ARM64 tools.
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            exe: dakken.exe
          # Linux: static musl binaries, so they run on old and new systems.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            exe: dakken
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            exe: dakken
          - os: macos-latest
            target: aarch64-apple-darwin
            exe: dakken
          # Intel macOS: cross-built on the Apple Silicon runner.
          - os: macos-latest
            target: x86_64-apple-darwin
            exe: dakken
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="dakken-$GITHUB_REF_NAME-${{ matrix.target }}"
          case "${{ matrix.exe }}" in *.exe) name="$name.exe" ;; esac
          cp "target/${{ matrix.target }}/release/${{ matrix.exe }}" "$name"
          gh release upload "$GITHUB_REF_NAME" "$name" --repo "$GITHUB_REPOSITORY"

  # SHA256SUMS lets a self-update check the file it downloads.
  checksums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern 'dakken-*' --dir files
          cd files
          sha256sum dakken-* > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS --repo "$GITHUB_REPOSITORY"

  # The Homebrew formula and the Scoop manifests for the new version,
  # committed to master (see .github/scripts/packaging.sh).
  packaging:
    needs: checksums
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir "$RUNNER_TEMP"
          sh .github/scripts/packaging.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/SHA256SUMS"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula bucket packaging/scoop
          if git diff --cached --quiet; then
            echo "The manifests are already for $GITHUB_REF_NAME."
            exit 0
          fi
          git commit -m "build: Homebrew and Scoop manifests for $GITHUB_REF_NAME"
          git push origin master

  # A winget pull request for the new version (see winget.yml).
  winget:
    needs: checksums
    uses: ./.github/workflows/winget.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
