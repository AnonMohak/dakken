name: release

# Push a tag like v0.2.0 to build dakken and publish a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: create
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: dakken.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            exe: dakken
          - os: macos-latest
            target: aarch64-apple-darwin
            exe: dakken
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: Upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="dakken-$GITHUB_REF_NAME-${{ matrix.target }}"
          case "${{ matrix.exe }}" in *.exe) name="$name.exe" ;; esac
          cp "target/release/${{ matrix.exe }}" "$name"
          gh release upload "$GITHUB_REF_NAME" "$name" --repo "$GITHUB_REPOSITORY"
