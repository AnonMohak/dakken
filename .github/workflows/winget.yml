name: winget

# Open a pull request at microsoft/winget-pkgs for a release. release.yml
# calls this after each release; run it by hand for an older tag with
# `gh workflow run winget.yml -f tag=v0.5.1`.
#
# It needs the repository secret WINGET_TOKEN: a classic GitHub token with
# the public_repo scope. It pushes to the fork AnonMohak/winget-pkgs.
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
    secrets:
      WINGET_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag, for example v0.5.1
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Skip with a note, not an error, until the token is set and winget
      # has the first version of the package: an update needs both.
      - id: ready
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$WINGET_TOKEN" ]; then
            echo "::notice::No WINGET_TOKEN secret, so no winget pull request."
            echo "go=false" >> "$GITHUB_OUTPUT"
          elif ! gh api repos/microsoft/winget-pkgs/contents/manifests/a/AnonMohak/dakken > /dev/null 2>&1; then
            echo "::notice::winget has no AnonMohak.dakken yet, so no update pull request."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.ready.outputs.go == 'true'
        # vedantmgoyal9/winget-releaser v2
        uses: vedantmgoyal9/winget-releaser@b7370d4d152efdce803a26cc6ca9eee58cb2ad54
        with:
          identifier: AnonMohak.dakken
          release-tag: ${{ inputs.tag }}
          installers-regex: '-(x86_64|aarch64)-pc-windows-msvc\.exe$'
          release-notes-url: https://github.com/AnonMohak/dakken/releases/tag/${{ inputs.tag }}
          token: ${{ secrets.WINGET_TOKEN }}
