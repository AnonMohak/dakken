[package]
name = "dakken"
version = "0.7.4"
edition = "2024"
description = "A typing-speed test for the terminal"
license = "MIT"
repository = "https://github.com/AnonMohak/dakken"
homepage = "https://github.com/AnonMohak/dakken"
readme = "README.md"
keywords = ["typing", "tui", "terminal", "typing-test", "wpm"]
categories = ["command-line-utilities", "games"]
include = ["src/**/*", "assets/**/*", "build.rs", "README.md", "LICENSE", "Cargo.toml", "Cargo.lock"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
rand = "0.10.3"
ratatui = "0.30.2"
serde_json = "1.0.154"
ureq = "3.5.0"

[profile.release]
lto = true
strip = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"
