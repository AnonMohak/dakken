[package]
name = "dakken"
version = "0.2.0"
edition = "2024"
description = "A monkeytype-style typing test for the terminal"
license = "MIT"
repository = "https://github.com/AnonMohak/dakken"
homepage = "https://github.com/AnonMohak/dakken"
readme = "README.md"
keywords = ["typing", "tui", "terminal", "monkeytype", "wpm"]
categories = ["command-line-utilities", "games"]
include = ["src/**/*", "assets/**/*", "README.md", "LICENSE", "Cargo.toml", "Cargo.lock"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
rand = "0.10.3"
ratatui = "0.30.2"

[profile.release]
lto = true
strip = true
